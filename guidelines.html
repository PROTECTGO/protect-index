<!-- ===================================================================
     Guidelines MGA · v2 (6-oct-2026)
     v2: ficha reorganizada (Perfilar arriba; cómo trabajar en acordeones;
         programas y tablas; notas), vista expandida a pantalla completa
         (botón Expandir / tecla E / doble clic en el nombre; flechas para
         pasar de mercado; Esc cierra; #m=<id>&x=1), lista ordenada por nombre.
     v1: Guidelines MGA (6-oct-2026)
     Los guidelines y apetitos de los 40 mercados (lo mismo del deck), vivos
     y buscables, dentro del Protect Index.
     - Datos: portal.guidelines_mga (fichas), portal.guidelines_tipos (los 5
       tipos de mercado) y portal.guidelines_aportes (experiencias del
       equipo). RLS: lo ve quien pase public.puede_ver('guidelines_mga');
       fichas y tipos solo los escribe sales@.
     - Se carga TODO en una sola vuelta y se busca en el navegador: sin
       tildes, sin mayúsculas, varias palabras = todas deben estar,
       sinónimos de cobertura (auto liability → AL, cargo → MTC…) y estados
       (TX, Texas, "new york") contra el campo states.
     - Experiencias del equipo: cada usuario cuenta lo que vivió con un
       mercado; queda "nuevo" con su nombre. Lo edita mientras siga nuevo.
       sales@ lo marca validado / incorporado / descartado (bandeja
       "Aportes nuevos"). La búsqueda solo usa los validados e incorporados.
     - Anti-descarga: sin botones de exportar, imprimir sale en blanco,
       sin clic derecho / copiar / seleccionar en el contenido, marca de
       agua con el correo del usuario. El archivo NO lleva datos adentro.
     - Nada guardado en el navegador: la ficha abierta va en la
       URL (#m=<id>).
     - ?demo=1 corre sin sesión ni base, leyendo window.GL_DEMO (lo inyecta
       el arnés de pruebas; el archivo publicado no trae datos).
     =================================================================== -->
<style>
:root{--ink:#1B2D3A;--ink2:#152430;--mint:#2DBFA3;--mint-deep:#229A82;--mint-soft:#C4E8DF;--bg:#F4F7FA;--card:#fff;--line:#E7EDF2;--txt:#28323B;--muted:#6B7D89;--ambar:#D9A520;--rojo:#D5594F;--indigo:#5B6BD6;--gris:#A3B0BA;
  --f-tit:'Montserrat',system-ui,sans-serif;--f-body:'Inter',system-ui,sans-serif;--f-num:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
[hidden]{display:none!important}
body{margin:0;font-family:var(--f-body);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:14px}
a{color:var(--mint-deep)}
.mono{font-family:var(--f-num)}
.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 80px}
#bloqueo{display:none;max-width:560px;margin:80px auto;padding:22px 24px;border-radius:14px;background:#FFF8E8;border:1px solid #F0E2BC;color:#6b5718;font-size:15px;line-height:1.55}
#app{display:none}
/* contenido protegido */
.prot{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.prot input,.prot textarea,.prot select{-webkit-user-select:text;user-select:text}
/* cabecera */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint-deep);font-weight:700}
h1{font-family:var(--f-tit);font-weight:800;font-size:24px;color:var(--ink);margin:4px 0 2px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px;line-height:1.5}
.top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.top .tit{min-width:0}
.buscar{flex:1 1 380px;max-width:560px;position:relative}
.buscar input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;font:15px var(--f-body);background:#fff;color:var(--txt)}
.buscar input:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(45,191,163,.15)}
.buscar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filtros select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:13px var(--f-body);background:#fff;color:var(--txt);min-width:0}
.filtros select.on{border-color:var(--mint-deep);background:#F1FAF8}
.lnk{background:none;border:none;color:var(--mint-deep);font:600 13px var(--f-body);cursor:pointer;padding:6px 4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:999px;font:600 13px var(--f-tit);cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{font-family:var(--f-num);font-weight:600}
.tab.adm{border-color:var(--ambar)}
.cuenta{margin-left:auto;font-size:12.5px;color:var(--muted)}
.cuenta b{font-family:var(--f-num);font-weight:600;color:var(--ink);font-size:12px}
/* mercados */
.mk{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.lista{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.lista-h{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lista-h .mono{color:var(--ink);font-weight:600}
.items{overflow:auto;flex:1}
.it{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;outline:none}
.it:hover{background:#F7FAFB}
.it:focus-visible{box-shadow:inset 0 0 0 2px var(--mint)}
.it.sel{background:#EEF8F5;box-shadow:inset 3px 0 0 var(--mint-deep)}
.logo{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{max-width:88%;max-height:88%;object-fit:contain}
.logo.ini{background:linear-gradient(135deg,#1B2D3A,#229A82);color:#fff;font:800 14px var(--f-tit);border:none}
.it .tx{min-width:0;flex:1}
.it .nm{font:700 13.5px var(--f-tit);color:var(--ink);line-height:1.25}
.it .pg{font-size:12px;color:var(--muted);margin-top:1px}
.it .row{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;align-items:center}
.it .der{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.tp{display:inline-block;font:700 10px var(--f-tit);letter-spacing:.05em;padding:3px 7px;border-radius:6px;white-space:nowrap}
.cv{display:inline-block;font:600 10.5px var(--f-num);padding:2px 6px;border-radius:5px;background:#EEF2F5;color:var(--ink);white-space:nowrap}
.cv.hit{background:var(--mint-soft);color:#0b4a3e;box-shadow:0 0 0 1px var(--mint-deep)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-activo{background:var(--mint)}.d-piloto{background:var(--indigo)}.d-pendiente_aval{background:var(--ambar)}.d-inactivo{background:var(--gris)}
.sit{font-size:10.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center;color:var(--muted);white-space:nowrap}
.viejo{font-size:10px;color:var(--muted);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.viejo .dot{background:#C3CCD3}
.dep{font:700 10px var(--f-tit);color:#6b5718;background:#FFF5D9;border:1px solid #F0E2BC;padding:1px 6px;border-radius:5px}
.vacio{padding:28px 16px;text-align:center;color:var(--muted);font-size:13.5px}
/* ficha */
.panel{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;min-height:300px;overflow:hidden}
.wm{position:absolute;inset:0;pointer-events:none;z-index:4;background-repeat:repeat}
.panel .volver{display:none;margin-bottom:12px}
.btn2{background:#fff;color:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:9px;font:600 13px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn2:hover{border-color:var(--mint)}
.btn{background:var(--mint-deep);color:#fff;border:none;padding:10px 16px;border-radius:10px;font:700 13.5px var(--f-tit);cursor:pointer}
.btn:hover{background:var(--mint)}
.btn:disabled{opacity:.55;cursor:wait}
.fh{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.fh .logos{display:flex;gap:8px}
.fh .logo{width:72px;height:72px;border-radius:12px}
.fh .logo.ini{font-size:22px}
.fh .t{flex:1;min-width:220px}
.fh h2{font:800 21px var(--f-tit);color:var(--ink);margin:0;line-height:1.2}
.fh .prog{font:600 14px var(--f-tit);color:var(--mint-deep);margin-top:2px}
.fh .via{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.45}
.fh .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sello{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--f-tit);letter-spacing:.04em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.s-activo{background:#E4F6F1;color:#16705F}
.s-piloto{background:#E9EBFA;color:#3D4BB0}
.s-pendiente_aval{background:#FFF5D9;color:#7a5d0c;border:1px solid var(--ambar)}
.s-inactivo{background:#EEF1F3;color:#5c6b75}
.covs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.covs .cv{font-size:12px;padding:4px 8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
.info .b{background:#F7F9FB;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.info .b .l{font:700 11px var(--f-tit);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.porconf{margin-top:12px;background:#FFF8E8;border:1px solid #F0E2BC;border-left:4px solid var(--ambar);border-radius:10px;padding:10px 14px;font-size:13px;color:#5d4a10}
.porconf .l{font:800 11px var(--f-tit);letter-spacing:.08em;text-transform:uppercase;color:#7a5d0c;margin-bottom:4px}
.porconf ul{margin:0;padding-left:18px;line-height:1.5}
.verif{margin-top:10px;font:12px var(--f-num);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{font:700 12.5px var(--f-tit);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;gap:7px}
.card h3 i{width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--mint)}
.card.bad h3 i{background:var(--rojo)}
.card ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.card li{margin-bottom:3px;overflow-wrap:anywhere}
.card .car{margin-bottom:8px}
.card .car b{font-size:13px;color:var(--ink)}
.tbls{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.tbl h3{font:700 13px var(--f-tit);color:var(--ink);margin:0 0 6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#F4F7FA;font:700 11px var(--f-tit);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:70px}
tr:last-child td{border-bottom:none}
.tbl .fn{font-size:12px;color:var(--muted);margin-top:5px}
mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 1px}
/* experiencias */
.exp{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.exp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.exp-h h3{font:800 15px var(--f-tit);color:var(--ink);margin:0}
.exp-h .n{font-family:var(--f-num)}
.exp .nota{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;line-height:1.5}
.ap{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.ap.descartado{opacity:.65}
.ap .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ap .meta b{color:var(--ink)}
.ap .tx{margin-top:6px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ap .resp{margin-top:8px;background:#F1FAF8;border:1px solid #CFEDE6;border-radius:9px;padding:8px 10px;font-size:12.5px;color:#23584D}
.ap .acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.st{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--f-tit);padding:2px 8px;border-radius:999px}
.st-nuevo{background:#E9EBFA;color:#3D4BB0}
.st-validado{background:#E4F6F1;color:#16705F}
.st-incorporado{background:#E4EEF6;color:#1B2D3A}
.st-descartado{background:#EEF1F3;color:#5c6b75}
.tag{font-size:11px;font-weight:600;background:#F4F7FA;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink)}
.frm{border:1px dashed var(--mint-deep);border-radius:12px;padding:14px;margin-bottom:12px;background:#FAFDFC}
.frm label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.frm textarea,.frm input,.frm select,.adm textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:14px var(--f-body);color:var(--txt);background:#fff}
.frm textarea{min-height:84px;resize:vertical}
.frm .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.frm .pie{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.frm .cnt{font:11.5px var(--f-num);color:var(--muted);margin-left:auto}
.err{color:var(--rojo);font-size:13px;min-height:0;margin-top:6px}
.adm{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.adm textarea{min-height:44px;font-size:13px}
.b-val{border-color:var(--mint-deep);color:#16705F}
.b-inc{border-color:var(--ink)}
.b-des{border-color:var(--gris);color:#5c6b75}
/* tipos */
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;border-top:4px solid var(--c,#229A82)}
.tcard h2{font:800 17px var(--f-tit);color:var(--ink);margin:6px 0 10px}
.tcard dl{margin:0}
.tcard dt{font:700 11px var(--f-tit);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.tcard dd{margin:3px 0 0;font-size:13px;line-height:1.55}
.tcard .ejs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ej{font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;background:#F7F9FB;color:var(--ink)}
a.ej{color:var(--mint-deep);text-decoration:none;font-weight:600;cursor:pointer}
a.ej:hover{border-color:var(--mint)}
/* bandeja */
.bandeja .ap .mer{font:700 13px var(--f-tit);color:var(--mint-deep);cursor:pointer;background:none;border:none;padding:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cargando{padding:60px 0;text-align:center;color:var(--muted)}
/* v2 · ficha reorganizada */
.fh .xbtn{margin-left:auto;align-self:flex-start}
.sec{font:700 11px var(--f-tit);letter-spacing:.14em;text-transform:uppercase;color:var(--mint-deep);margin:24px 0 0;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec+.cards,.sec+.dls{margin-top:10px}
.cards{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.info .b b.big{font:700 14px var(--f-tit);color:var(--ink)}
.info .b .viejo{margin-top:4px}
details.mini{margin-top:4px}
details.mini>summary{cursor:pointer;color:var(--mint-deep);font-weight:600;font-size:12.5px;list-style:none}
details.mini>summary::-webkit-details-marker{display:none}
details.mini>summary::after{content:" ▾"}
details.mini[open]>summary::after{content:" ▴"}
details.mini>div{margin-top:4px}
.card li.mas{display:none}
.card.full li.mas{display:list-item}
.vermas{background:none;border:none;color:var(--mint-deep);font:600 12.5px var(--f-body);cursor:pointer;padding:6px 0 0}
.card.full .vermas{display:none}
.dls{display:flex;flex-direction:column;gap:8px;margin-top:10px}
details.dl{background:#fff;border:1px solid var(--line);border-radius:12px}
details.dl>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 12.5px var(--f-tit);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border-radius:12px}
details.dl>summary::-webkit-details-marker{display:none}
details.dl>summary:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--mint)}
details.dl>summary::after{content:"+";font:700 17px var(--f-num);color:var(--mint-deep);line-height:1}
details.dl[open]>summary::after{content:"−"}
details.dl .ct{font:600 11px var(--f-num);background:#EEF2F5;border-radius:999px;padding:1px 8px;color:var(--ink);margin-left:8px;letter-spacing:0;text-transform:none}
details.dl>ul{margin:0;padding:0 16px 14px 34px;font-size:13px;line-height:1.55}
details.dl>ul li{margin-bottom:3px;overflow-wrap:anywhere}
details.dl .tbx{padding:0 14px 14px}
details.dl .tbx .fn{font-size:12px;color:var(--muted);margin-top:6px}
/* v2 · vista expandida */
dialog.xp{padding:0;border:none;width:100vw;height:100vh;max-width:100vw;max-height:100vh;margin:0;background:var(--bg);color:var(--txt)}
dialog.xp::backdrop{background:rgba(13,48,64,.55)}
dialog.xp:not([open]){display:none}
dialog.xp[open]{display:flex;flex-direction:column}
html.xp-on,html.xp-on body{overflow:hidden}
.xp-bar{flex:none;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:6}
.xp-id{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.xp-id .t{min-width:0}
.xp-id b{display:block;font:800 15px var(--f-tit);color:var(--ink);line-height:1.2;overflow-wrap:anywhere}
.xp-id .sello{margin-top:3px}
.xp-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.xp-nav .mono{font-size:12px;color:var(--muted);padding:0 4px}
.xp-nav .btn2:disabled{opacity:.4;cursor:default}
.xp-x{border-color:var(--ink)}
.xp-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.xwrap{position:relative;min-height:100%}
.xficha{max-width:1100px;margin:0 auto;padding:28px 28px 70px;font-size:16px}
.xficha .fh .logo{width:88px;height:88px}
.xficha .fh h2{font-size:27px}
.xficha .fh .prog{font-size:16px}
.xficha .fh .via{font-size:15px}
.xficha .covs .cv{font-size:13.5px;padding:5px 10px}
.xficha .info .b{font-size:15px}
.xficha .info .b b.big{font-size:16px}
.xficha .porconf{font-size:15px}
.xficha .sec{font-size:12.5px;margin-top:30px}
.xficha .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.xficha .card{padding:18px 20px}

function arr(v){return Array.isArray(v)?v.filter(function(x){return x!=null&&String(x).trim()!=="";}):[];}

var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fecha(v){
  if(!v)return "—";
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v); var d;

  return ("0"+d.getDate()).slice(-2)+" "+MESES[d.getMonth()]+" "+d.getFullYear();
}
function viejo(v){ if(!v)return true; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v); if(!m)return true;
  var d=new Date(+m[1],+m[2]-1,+m[3]); return (Date.now()-d.getTime())>183*864e5; }

function iniciales(n){var p=String(n||"").replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/);return (((p[0]||"")[0]||"")+((p[1]||"")[0]||"")).toUpperCase()||"?";}

}

/* ---------------- catálogos ---------------- */
var ESTADOS=[["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"]];

/* nombres completos (en búsqueda, sin tildes) -> código; incluye variantes en español */
var EST_NOMBRES=[]; ESTADOS.forEach(function(e){EST_NOMBRES.push([norm(e[1]),e[0]]);});
[["nueva york","NY"],["nuevo mexico","NM"],["nueva jersey","NJ"],["carolina del norte","NC"],["carolina del sur","SC"],["pensilvania","PA"],["luisiana","LA"],["misisipi","MS"],["washington dc","DC"],["dakota del norte","ND"],["dakota del sur","SD"],["virginia occidental","WV"],["hawai","HI"]].forEach(function(x){EST_NOMBRES.push(x);});
EST_NOMBRES.sort(function(a,b){return b[0].length-a[0].length;});
/* códigos en minúscula que NO se toman como estado (chocan con palabras o coberturas) */
var EST_MIN_NO={al:1,"in":1,or:1,me:1,de:1,la:1,ne:1,co:1,pa:1,ok:1,hi:1,oh:1,ma:1,mi:1,mo:1,id:1,va:1,ga:1,wa:1,nv:1,ms:1,mt:1,sd:1,nd:1,ri:1,ia:1,ks:1,md:1,ct:1,ut:1,wi:1,vt:1,nh:1,sc:1,nc:1,ar:1,mn:1,dc:1,wv:1,ak:1,wy:1};
var COBS=[["AL","AL"],["PD/APD","PD / APD"],["MTC","MTC"],["GL","GL"],["NTL","NTL"],["TI","TI"],["Excess","Excess"],["WC","WC"]];
function covCanon(c){
  var n=norm(c).replace(/\s+/g," ").trim();
  if(n==="al"||n==="auto liability")return ["AL"];
  if(n==="pd"||n==="apd"||n==="physical damage")return ["PD/APD"];
  if(n==="mtc"||n==="cargo")return ["MTC"];
  if(n==="mtc excess")return ["Excess"];
  if(n==="gl")return ["GL"];
  if(n==="ntl"||n==="bobtail")return ["NTL"];
  if(n==="ti")return ["TI"];
  if(n==="wc")return ["WC"];
  if(n==="excess"||n==="xs"||n==="excess al"||n==="umbrella"||n.indexOf("excess")>=0)return ["Excess"];
  return [];
}
/* sinónimos: frase escrita -> cobertura (cov) o textos alternativos (alt) */
var SINONIMOS=[
  {k:["general liability","responsabilidad general","gl"],cov:"GL"},
  {k:["auto liability","liability","responsabilidad civil","al"],cov:"AL"},
  {k:["physical damage","auto physical damage","danos fisicos","danos","dano fisico","apd","pd"],cov:"PD/APD"},
  {k:["motor truck cargo","cargo","carga","mtc"],cov:"MTC"},
  {k:["excess","umbrella","exceso","xs"],cov:"Excess"},
  {k:["workers comp","workers compensation","workers","wc"],cov:"WC"},
  {k:["trailer interchange","ti"],cov:"TI"},
  {k:["non trucking","non-trucking","bobtail","ntl"],cov:"NTL"},
  {k:["new venture","new ventures","empresa nueva","negocio nuevo","nuevo negocio"],alt:["new venture","empresa nueva","negocio nuevo","nuevo negocio","nuevas empresas","new business"]},
  {k:["mexicanos","mexicano"],alt:["mexican","mexico"]}
];
var SIN_KEYS=[]; SINONIMOS.forEach(function(s){s.k.forEach(function(k){SIN_KEYS.push([norm(k),s]);});});
SIN_KEYS.sort(function(a,b){return b[0].length-a[0].length;});
var TIPO_AP=[["acepto","Aceptó"],["declino","Declinó"],["tiempo","Tiempo de respuesta"],["requisito","Requisito"],["precio","Precio"],["otro","Otro"]];
var TIPO_AP_L={}; TIPO_AP.forEach(function(t){TIPO_AP_L[t[0]]=t[1];});
var SELLO={nuevo:"🕓 nuevo",validado:"✅ validado",incorporado:"📌 incorporado",descartado:"✖ descartado"};
var EST_L={activo:"Activo",piloto:"Piloto",pendiente_aval:"Pendiente aval",inactivo:"Inactivo"};

/* ---------------- estado ---------------- */
var sb=null, EMAIL="", ADM=false;
var TIPOS=[], TIPO={}, FICHAS=[], FX={}, APORTES=[], PERSONAS={};
var S={view:"mercados", sel:null, q:"", parsed:null, res:[], depende:{}, editando:null, formAbierto:false};

/* ---------------- estados (states jsonb) ---------------- */
function codigos(txt){ var out={}; (String(txt||"").match(/\b[A-Z]{2}\b/g)||[]).forEach(function(c){if(EST_SET[c])out[c]=1;}); return out; }
/* Lee un texto libre de estados por segmentos: "NO / AÚN NO / excepto" = exclusión; "todos" = el resto entra */
function leerTexto(txt){
  var r={neg:{},pos:{},todos:false,algo:false};
  String(txt||"").split(/\.\s+|\s·\s|\n/).forEach(function(seg){
    var cs=codigos(seg), neg=/(^|[\s(:])(AÚN NO|NO)\b/.test(seg)||/excepto/i.test(seg);
    if(/todos/i.test(seg))r.todos=true;
    Object.keys(cs).forEach(function(c){ r.algo=true; if(neg)r.neg[c]=1; else r.pos[c]=1; });
  });
  return r;
}
/* devuelve "si" | "no" | "depende" */
function estadoEn(f,code){
  var st=f.states||{}, mode=st.mode||"depends", list=arr(st.list).map(function(x){return String(x).toUpperCase();});
  var en=list.indexOf(code)>=0;
  if(mode==="all")return "si";
  if(mode==="all_except"||mode==="only"){
    var ok=mode==="all_except"?!en:en;
    if(ok)return "si";
    if(st.note){ var t=leerTexto(st.note); if(t.todos&&!t.neg[code])return "depende"; }
    return "no";
  }
  if(mode==="custom"){
    var t2=leerTexto((st.label||"")+". "+(st.note||""));
    if(t2.neg[code])return "no";
    if(t2.pos[code]||t2.todos)return "depende";
    if(t2.algo)return "no";
    return "depende";
  }
  return "depende"; /* depends */
}
function estadosTexto(f){
  var st=f.states||{}, list=arr(st.list), partes=[];
  if(st.mode==="all")partes.push("Todos los estados");
  else if(st.mode==="all_except")partes.push("Todos excepto: "+list.join(", "));
  else if(st.mode==="only")partes.push("Solo: "+list.join(", "));
  if(st.label)partes.push(st.label);
  if(st.note)partes.push(st.note);
  return partes.length?partes.map(esc).join("<br>"):"—";
}

/* ---------------- preparación ---------------- */
function prep(f){
  var cs={}; arr(f.coverages).forEach(function(c){covCanon(c).forEach(function(k){cs[k]=1;});}); f._cov=cs;
  hay(f);
}
function hay(f){
  var p=[f.id,f.name,f.program,f.via,f.coverage_note,(TIPO[f.tipo]||{}).label,(f.states||{}).label,(f.states||{}).note];
  p=p.concat(arr(f.coverages));
  ["how_it_works","acceptable","unacceptable","driver","new_business","pricing","submission","notes","pending"].forEach(function(k){p=p.concat(arr(f[k]));});
  (Array.isArray(f.carriers)?f.carriers:[]).forEach(function(c){ if(typeof c==="string")p.push(c); else if(c){p.push(c.name); p=p.concat(arr(c.detail));} });
  (Array.isArray(f.tables)?f.tables:[]).forEach(function(t){ if(!t)return; p.push(t.title,t.footnote); p=p.concat(arr(t.headers)); (t.rows||[]).forEach(function(r){p=p.concat(arr(r));}); });
  APORTES.forEach(function(a){ if(a.mga_id===f.id&&(a.estado==="validado"||a.estado==="incorporado")){p.push(a.texto,a.cuenta);} });
  f._hay=" "+norm(p.filter(Boolean).join(" \n "))+" ";
}

/* ---------------- búsqueda ---------------- */
function parse(qRaw){
  var out={cov:[],alt:[],txt:[],est:[],hl:[]};
  var raw=String(qRaw||"").trim(); if(!raw)return out;
  /* códigos de estado en MAYÚSCULA (TX, NY…) — AL se toma como cobertura */
  raw=raw.replace(/\b[A-Z]{2}\b/g,function(c){ if(EST_SET[c]&&c!=="AL"){out.est.push(c);return " ";} return c; });
  var q=" "+norm(raw).replace(/[,;]+/g," ").replace(/\s+/g," ")+" ";
  EST_NOMBRES.forEach(function(e){ var k=" "+e[0]+" "; while(q.indexOf(k)>=0){ out.est.push(e[1]); q=q.replace(k," "); } });
  SIN_KEYS.forEach(function(e){ var k=" "+e[0]+" "; while(q.indexOf(k)>=0){ q=q.replace(k," ");
      if(e[1].cov){ if(out.cov.indexOf(e[1].cov)<0)out.cov.push(e[1].cov); if(e[0].length>=4)out.hl.push(e[0]); }
      else { out.alt.push(e[1].alt.concat([e[0]])); out.hl=out.hl.concat(e[1].alt,[e[0]]); } } });
  q.split(" ").forEach(function(t){
    if(!t)return;
    if(t.length===2&&EST_SET[t.toUpperCase()]&&!EST_MIN_NO[t]){out.est.push(t.toUpperCase());return;}
    if(t.length<2&&!/\d/.test(t))return;
    out.txt.push(t); out.hl.push(t);
  });
  return out;
}
function aplicar(){
  var P=S.parsed||parse(""), fT=$("fTipo").value, fC=$("fCov").value, fE=$("fEst").value, fS=$("fSit").value;
  var est=P.est.slice(); if(fE&&est.indexOf(fE)<0)est.push(fE);
  var dep={};
  var res=FICHAS.filter(function(f){
    if(fT&&f.tipo!==fT)return false;
    if(fC&&!f._cov[fC])return false;
    if(fS){ if(fS==="confirmar"){ if(!arr(f.pending).length)return false; } else if(f.estado!==fS)return false; }
    for(var i=0;i<P.cov.length;i++) if(!f._cov[P.cov[i]])return false;
    for(var j=0;j<P.alt.length;j++){ if(!P.alt[j].some(function(a){return f._hay.indexOf(norm(a))>=0;}))return false; }
    for(var k=0;k<P.txt.length;k++) if(f._hay.indexOf(P.txt[k])<0)return false;
    for(var m=0;m<est.length;m++){ var r=estadoEn(f,est[m]); if(r==="no")return false; if(r==="depende")dep[f.id]=(dep[f.id]||[]).concat(est[m]); }
    return true;
  });
  S.res=res; S.depende=dep; S.estBuscados=est;
  ["fTipo","fCov","fEst","fSit"].forEach(function(id){$(id).classList.toggle("on",!!$(id).value);});
  pintarLista();
  if(S.view==="mercados"){
    var ancho=window.innerWidth>860;
    if(ancho&&(!S.sel||res.indexOf(FX[S.sel])<0)&&res.length&&!leerHash()) abrir(res[0].id,false);
    else if(S.sel) pintarFicha();
  }
}

  if(arr(f.pending).length)h+='<span class="sit" style="color:#7a5d0c" title="Tiene puntos por confirmar">▲ por confirmar</span>';
  if(viejo(f.verificado))h+='<span class="viejo" title="Sin verificar en los últimos 6 meses"><span class="dot"></span>sin verificar</span>';

function pintarLista(){

/* ---------------- resaltado ---------------- */
function resaltar(root,terms){
  terms=(terms||[]).map(norm).filter(function(t){return t.length>=2;});
  if(!terms.length)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode; if(!p||/^(SCRIPT|STYLE|MARK|TEXTAREA|OPTION|BUTTON|LABEL|SELECT)$/.test(p.nodeName)||p.closest(".frm,.adm,.acc"))return NodeFilter.FILTER_REJECT;
    return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  var nodes=[]; while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){
    var o=n.nodeValue, ns="", map=[];
    for(var i=0;i<o.length;i++){ var c=norm(o[i]); for(var j=0;j<c.length;j++){ns+=c[j];map.push(i);} }
    var rg=[];
    terms.forEach(function(t){ var p=0; while((p=ns.indexOf(t,p))>=0){ rg.push([map[p],map[p+t.length-1]+1]); p+=t.length; } });
    if(!rg.length)return;
    rg.sort(function(a,b){return a[0]-b[0];}); var mg=[];
    rg.forEach(function(r){ if(mg.length&&r[0]<=mg[mg.length-1][1])mg[mg.length-1][1]=Math.max(mg[mg.length-1][1],r[1]); else mg.push(r.slice()); });
    var fr=document.createDocumentFragment(), last=0;
    mg.forEach(function(r){ if(r[0]>last)fr.appendChild(document.createTextNode(o.slice(last,r[0]))); var mk=document.createElement("mark"); mk.textContent=o.slice(r[0],r[1]); fr.appendChild(mk); last=r[1]; });
    if(last<o.length)fr.appendChild(document.createTextNode(o.slice(last)));
    n.parentNode.replaceChild(fr,n);
  });
}

function buscarFicha(txt){
  var n=norm(txt).trim(); if(!n)return null;
  var f=FX[n]; if(f)return f;
  var best=null;
  FICHAS.forEach(function(x){ if(best)return; var nn=norm(x.name); var nb=nn.split(/[·(–-]/)[0].trim();
    if(nn===n||nb===n)best=x; });
  if(best)return best;
  FICHAS.forEach(function(x){ if(best)return; var nb=norm(x.name).split(/[·(–-]/)[0].trim();
    var re=function(a,b){return (" "+b+" ").indexOf(" "+a+" ")>=0;};
    if(nb.length>=3&&(re(nb,n)||re(n,nb)))best=x; });
  if(best)return best;
  FICHAS.forEach(function(x){ if(best)return; var w=norm(x.name).split(/\s+/)[0]; if(w.length>=3&&(" "+n+" ").indexOf(" "+w+" ")>=0)best=x; });
  return best;
}

  if(v==="aportes")pintarBandeja();
}

/* ---------------- vista expandida (v2) ---------------- */
var XP=false, XPscroll=0;
function abrirX(conHash){
  if(!S.sel||!FX[S.sel])return;
  if(!XP){
    XPscroll=window.scrollY||0; XP=true;
    $("ficha").innerHTML=""; /* una sola superficie viva: ids únicos (expBox, formularios) */
    var d=$("xp"); try{ if(!d.open)d.showModal(); }catch(e){ d.setAttribute("open",""); }
    document.documentElement.classList.add("xp-on");
  }
  pintarX();
  if(conHash!==false)ponerHash();
}
function pintarX(){
  var f=FX[S.sel]; if(!f)return;
  $("xpId").innerHTML=logoHtml(f.logo,f.name)+'<div class="t"><b>'+esc(f.name)+'</b><span class="sello s-'+esc(f.estado||"activo")+'"><span class="dot d-'+esc(f.estado||"activo")+'"></span>'+esc(EST_L[f.estado]||"Activo")+'</span></div>';
  arreglarLogos($("xpId"));
  var i=S.res.indexOf(f), n=S.res.length;
  $("xpPos").textContent=i>=0?(i+1)+" / "+n:"";
  $("xpPrev").disabled=!(i>0); $("xpNext").disabled=!(i>=0&&i<n-1);
  pintarFicha();
  $("xpBody").scrollTop=0;
}
function moverX(d){
  var i=S.res.indexOf(FX[S.sel]); if(i<0)return; var j=i+d; if(j<0||j>=S.res.length)return;
  S.sel=S.res[j].id; S.formAbierto=false; S.editando=null;
  document.querySelectorAll(".it").forEach(function(x){x.classList.toggle("sel",x.getAttribute("data-id")===S.sel);});
  pintarX(); ponerHash();
}
function cerrarX(){
  if(!XP)return; XP=false;
  var d=$("xp"); if(d.open){ try{d.close();}catch(e){d.removeAttribute("open");} }
  $("xficha").innerHTML=""; document.documentElement.classList.remove("xp-on");
  pintarFicha(); ponerHash();
  window.scrollTo(0,XPscroll);
  var it=document.querySelector('.it[data-id="'+(S.sel||"")+'"]'); if(it&&window.innerWidth>860)it.scrollIntoView({block:"nearest"});
}

/* ---------------- marca de agua ---------------- */
function marca(){
  var txt=EMAIL+" · "+fecha(new Date().toISOString().slice(0,10));
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200"><text x="20" y="120" transform="rotate(-24 180 100)" font-family="Inter,Arial,sans-serif" font-size="14" fill="#1B2D3A" fill-opacity="0.075">'+esc(txt)+'</text></svg>';
  document.querySelectorAll(".wm").forEach(function(w){ w.style.backgroundImage='url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")'; w.setAttribute("data-email",EMAIL); });
}

/* ---------------- anti-descarga ---------------- */
function enCampo(t){ return t&&t.closest&&t.closest("input,textarea,select,[contenteditable=true]"); }
["contextmenu","copy","cut","selectstart","dragstart"].forEach(function(ev){
  document.addEventListener(ev,function(e){ if(enCampo(e.target))return; if(e.target&&e.target.closest&&e.target.closest("#app"))e.preventDefault(); },true);
});
document.addEventListener("keydown",function(e){
  if(!(e.ctrlKey||e.metaKey))return; var k=String(e.key||"").toLowerCase();
  if(k==="p"||k==="s"){e.preventDefault();return;}
  if((k==="c"||k==="x"||k==="a")&&!enCampo(e.target))e.preventDefault();
},true);

/* ---------------- eventos ---------------- */
function enlazar(){
  var tmr=null;
  $("q").addEventListener("input",function(){ clearTimeout(tmr); tmr=setTimeout(function(){ S.q=$("q").value; S.parsed=parse(S.q); aplicar(); },120); });
  ["fTipo","fCov","fEst","fSit"].forEach(function(id){ $(id).addEventListener("change",aplicar); });
  $("limpiar").addEventListener("click",function(){ ["fTipo","fCov","fEst","fSit"].forEach(function(id){$(id).value="";}); $("q").value=""; S.q=""; S.parsed=parse(""); aplicar(); });
  $("volver").addEventListener("click",volverLista);
  $("items").addEventListener("click",function(e){ var it=e.target.closest(".it"); if(it)abrir(it.getAttribute("data-id"),true); });
  $("items").addEventListener("keydown",function(e){ var it=e.target.closest(".it"); if(!it)return;
    if(e.key==="Enter"||e.key===" "){e.preventDefault();abrir(it.getAttribute("data-id"),true);}
    if(e.key==="ArrowDown"&&it.nextElementSibling){e.preventDefault();it.nextElementSibling.focus();}
    if(e.key==="ArrowUp"&&it.previousElementSibling){e.preventDefault();it.previousElementSibling.focus();} });
  document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click",function(){ verVista(t.getAttribute("data-view")); }); });
  window.addEventListener("hashchange",function(){ var h=leerHashX(); if(!h||!FX[h.id]){ if(XP)cerrarX(); return; }
    if(h.id!==S.sel){ if(XP){ S.sel=h.id; pintarX(); } else abrir(h.id,false); }
    if(h.x&&!XP)abrirX(false); else if(!h.x&&XP)cerrarX(); });
  /* vista expandida */
  $("xpCerrar").addEventListener("click",cerrarX);
  $("xpPrev").addEventListener("click",function(){moverX(-1);});
  $("xpNext").addEventListener("click",function(){moverX(1);});
  $("xp").addEventListener("cancel",function(e){ e.preventDefault(); cerrarX(); });
  $("ficha").addEventListener("dblclick",function(e){ if(e.target.closest(".fh h2"))abrirX(); });
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||enCampo(e.target))return;
    if(XP){
      if(e.key==="ArrowLeft"){e.preventDefault();moverX(-1);}
      else if(e.key==="ArrowRight"){e.preventDefault();moverX(1);}
      else if(e.key==="Escape"){e.preventDefault();cerrarX();}
      return;
    }
    if((e.key==="e"||e.key==="E")&&S.view==="mercados"&&S.sel&&FX[S.sel]&&!$("vMercados").hidden){ e.preventDefault(); abrirX(); }
  });
  document.addEventListener("input",function(e){ var t=e.target; if(t.getAttribute&&t.getAttribute("data-f")==="texto"){ var c=t.closest(".frm").querySelector('[data-f="cnt"]'); if(c)c.textContent=t.value.trim().length+" / mín. 20"; } });
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]"); if(!b)return;
    var act=b.getAttribute("data-act"), id=b.getAttribute("data-id");
    if(act==="ir"){ e.preventDefault(); if(XP)cerrarX(); abrir(id,true); }
    else if(act==="expandir"){ abrirX(); }
    else if(act==="vermas"){ var cd=b.closest(".card"); if(cd)cd.classList.add("full"); }
    else if(act==="abrirForm"){ S.formAbierto=true; repintarExp(); var ta=document.querySelector('[data-frm="nuevo"] textarea'); if(ta)ta.focus(); }
    else if(act==="cancelar"){ if(id==="nuevo")S.formAbierto=false; else S.editando=null; repintarExp(); }
    else if(act==="guardar"){ guardar(id); }
    else if(act==="editar"){ S.editando=id; repintarExp(); }
    else if(act==="estado"){ cambiarEstado(id,b.getAttribute("data-est")); }
  });
  var anchoAntes=window.innerWidth>860;
  window.addEventListener("resize",function(){ var a=window.innerWidth>860; if(a!==anchoAntes){anchoAntes=a; if(a&&S.sel)$("mk").classList.add("solo-ficha");} });
}

/* ---------------- arranque ---------------- */
function llenarFiltros(){
  $("fTipo").innerHTML='<option value="">Tipo: todos</option>'+TIPOS.map(function(t){return '<option value="'+esc(t.key)+'">'+esc(t.label)+'</option>';}).join("");
  $("fCov").innerHTML='<option value="">Cobertura: todas</option>'+COBS.map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>';}).join("");
  $("fEst").innerHTML='<option value="">Estado: todos</option>'+ESTADOS.map(function(e){return '<option value="'+e[0]+'">'+e[0]+' · '+esc(e[1])+'</option>';}).join("");
}
function montar(tipos,fichas,aportes,personas){
  TIPOS=(tipos||[]).slice().sort(function(a,b){return (a.orden||0)-(b.orden||0);}); TIPO={}; TIPOS.forEach(function(t){TIPO[t.key]=t;});
  APORTES=(aportes||[]).slice();
  PERSONAS={}; (personas||[]).forEach(function(p){ if(p&&p.email)PERSONAS[String(p.email).toLowerCase()]=p.nombre; });
  /* v2: orden por nombre (decisión de Andrés 6-oct-2026); orden solo desempata */
  FICHAS=(fichas||[]).slice().sort(function(a,b){return String(a.name||"").localeCompare(String(b.name||""),"es",{sensitivity:"base"})||((a.orden==null?9999:a.orden)-(b.orden==null?9999:b.orden));});
  FX={}; FICHAS.forEach(function(f){FX[f.id]=f;}); FICHAS.forEach(prep);
  $("app").style.display="block"; $("bloqueo").style.display="none";
  $("yo").textContent=EMAIL||"—";
  $("tabAportes").hidden=!ADM;
  llenarFiltros(); contarNuevos(); marca();
  S.parsed=parse("");
  aplicar();
  var h=leerHashX(); if(h&&FX[h.id]){ abrir(h.id,false); if(h.x)abrirX(false); }
}
function fijarUsuario(email){ EMAIL=String(email||"").toLowerCase(); ADM=EMAIL===ADMIN; }

})();
